.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}

.pn{background:var(--pn);border:1px solid var(--bd);border-radius:16px;padding:16px}.pn small,.mu{color:var(--mu)}.pn p{font-size:.78rem;color:var(--mu)}
